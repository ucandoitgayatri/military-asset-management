spring.application.name=military-asset-management

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

server.port=${PORT:8080}

server.servlet.session.cookie.same-site=${SESSION_SAMESITE:lax}
server.servlet.session.cookie.secure=${SESSION_SECURE:false}